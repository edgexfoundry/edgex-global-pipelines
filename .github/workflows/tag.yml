name: Tag
on:
  push:
    branches: [main]

jobs:
  tag:
    if: github.repository_owner == 'edgexfoundry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: semver-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag, bump patch and update experimental
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"

          # Skip if HEAD is already tagged with a version (re-run protection, same as GITSEMVER_HEAD_TAG)
          if git tag --points-at HEAD | grep -q '^v[0-9]'; then
            echo "HEAD already tagged, skip"; exit 0
          fi

          VERSION=$(git show origin/semver:main)
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "unexpected version: $VERSION"; exit 1
          fi
          # Same behavior as py-git-semver "bump patch"
          NEXT="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3]+1))"

          git tag -a "v${VERSION}" -m "v${VERSION}"
          # Same behavior as edgeXUpdateNamedTag
          git tag -f -a experimental -m "update experimental to v${VERSION}"

          git worktree add -B semver .semver origin/semver
          echo -n "$NEXT" > .semver/main
          git -C .semver commit -am "semver(main): ${NEXT}"

          # Push the tags and the semver branch together so they never get out of sync
          git push --atomic origin semver "refs/tags/v${VERSION}" "+refs/tags/experimental"
